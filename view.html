<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner Preview</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fullscreen Banner Container */
    #banner-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Minimalist Loading Spinner */
    .loading-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      color: #64748b;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      color: #1e293b;
      z-index: 20;
    }

    .error-screen h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #ef4444;
    }

    .error-screen p {
      font-size: 0.9rem;
      color: #64748b;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div id="banner-container">
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <p style="font-size: 0.875rem;">Loading Banner...</p>
    </div>

    <!-- Error Screen -->
    <div class="error-screen" id="error-screen">
      <h2>Banner Unavailable</h2>
      <p id="error-msg">The requested banner link is invalid or expired.</p>
    </div>

    <!-- Banner Frame -->
    <iframe id="banner-frame" title="Banner View" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loadingScreen = document.getElementById('loading-screen');
      const errorScreen = document.getElementById('error-screen');
      const errorMsg = document.getElementById('error-msg');
      const bannerFrame = document.getElementById('banner-frame');

      // Extract project ID from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');

      if (!projectId) {
        showError('Invalid banner link.');
        return;
      }

      try {
        let projectData = null;
        let htmlContent = null;

        // Query ONLY the single specific document from Firestore
        if (window.firebaseManager && window.firebaseManager.isFirebaseActive) {
          try {
            const docRef = await window.firebaseManager.db.collection('banner_projects').doc(projectId).get();
            if (docRef.exists) {
              projectData = docRef.data();
              htmlContent = projectData.htmlContent || null;
            }
          } catch (e) {
            console.warn('Firestore fetch notice:', e);
          }
        }

        // Fallback Firebase check
        if (!projectData && typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) {
          try {
            const docRef = await firebase.firestore().collection('banner_projects').doc(projectId).get();
            if (docRef.exists) {
              projectData = docRef.data();
              htmlContent = projectData.htmlContent || null;
            }
          } catch (e) {
            console.warn('Fallback Firebase fetch notice:', e);
          }
        }

        // Local Storage fallback for local testing
        if (!projectData) {
          const localStr = localStorage.getItem('adlink_hub_projects');
          if (localStr) {
            try {
              const projects = JSON.parse(localStr);
              projectData = projects.find(p => p.id === projectId);
              if (projectData) {
                htmlContent = projectData.htmlContent || localStorage.getItem(`adlink_html_${projectId}`) || null;
              }
            } catch (e) {
              console.warn('LocalStorage notice:', e);
            }
          }
        }

        if (!projectData && !htmlContent) {
          showError('Banner not found or link has expired.');
          return;
        }

        // Update Document Title to Project Name
        if (projectData && projectData.projectName) {
          document.title = projectData.projectName;
        }

        // Render Banner full screen
        loadingScreen.style.display = 'none';

        if (htmlContent) {
          const doc = bannerFrame.contentWindow.document;
          doc.open();
          doc.write(htmlContent);
          doc.close();
        } else if (projectData.mainHtmlUrl && !projectData.mainHtmlUrl.startsWith('blob:')) {
          bannerFrame.src = projectData.mainHtmlUrl;
        } else {
          showError('Banner content unavailable.');
        }

      } catch (err) {
        console.error('Render error:', err);
        showError('Unable to display banner.');
      }

      function showError(msg) {
        loadingScreen.style.display = 'none';
        bannerFrame.style.display = 'none';
        errorScreen.style.display = 'flex';
        errorMsg.textContent = msg;
      }
    });
  </script>
</body>
</html>
